; Cepheus Trader installer data for Synchronet's install-xtrn.js
;   jsexec install-xtrn /path/to/cepheus-trader
; (or, from the terminal: ;exec ?install-xtrn /path/to/cepheus-trader)

Name: Cepheus Trader
Desc: Shared-universe science-fiction trading and command door
By:   Cepheus Trader contributors
Cats: Games
Subs: Strategy, Trading, Role-Playing
Inst: 2026/08/07

; CHAIN.TXT supplies the real name, handle, user number, ANSI capability, and
; current terminal dimensions. Synchronet's socket I/O method passes its local
; protocol-neutral passthru socket as %h; Synchronet continues to handle Telnet
; negotiation and IAC expansion on the caller-facing connection.
;
; Synchronet translates the door's CP437/ASCII output for the caller's
; character set. XTRN_NODISPLAY suppresses a per-session local console window,
; and -SILENT suppresses the OpenDoors local status display.
[prog:CEPHEUS]
name     = Cepheus Trader
cmd      = bin/cepheus-trader-door%. -D %f -SOCKET %h -SILENT
type     = XTRN_WWIV
settings = XTRN_NATIVE | XTRN_MULTIUSER | XTRN_NODISPLAY
note     = Configure cepheus-trader.conf and the BBS credential before opening the door to callers.
