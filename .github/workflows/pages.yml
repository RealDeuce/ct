name: Player documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "catalog/ships/**"
      - "catalog/shipbuilding/**"
      - "catalog/combat-rules.toml"
      - "tools/ship_design.py"
      - "tools/shipbuilding_rules.py"
      - "tools/small_craft_design.py"
      - "docs/player-guide.md"
      - "docs/game-rules.md"
      - "LICENSE.md"
      - "OPEN_GAME_LICENSE.md"
      - "client/src/door_help.cpp"
      - "client/include/ct/door_help.hpp"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build player documentation
        run: python3 site/build.py --output site/_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
