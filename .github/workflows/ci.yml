name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-check tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate repository and catalog
        run: |
          python3 tools/check_repository.py
          python3 -m unittest discover -s tools -p 'test_*.py'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build pkg-config python3
          capnproto libcapnp-dev libbotan-3-dev libgnutls28-dev
      - name: Select stable Rust with lint components
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path server/Cargo.toml
      - name: Version probes
        run: |
          cargo run --manifest-path server/Cargo.toml --bin cepheus-trader-server -- --version
          cargo run --manifest-path server/Cargo.toml --bin cepheus-trader-universe-tour -- --version

  client-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build pkg-config python3
          capnproto libcapnp-dev libbotan-3-dev xz-utils
      - name: Configure, build, and test
        run: |
          cmake -S client -B build/client-native -G Ninja
          cmake --build build/client-native
          ctest --test-dir build/client-native --output-on-failure
          build/client-native/cepheus-trader-door --version
          build/client-native/cepheus-trader-sysop --version

  client-pinned-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential ca-certificates cmake ninja-build pkg-config python3 xz-utils
      - name: Configure pinned source dependencies
        run: >-
          cmake -S client -B build/client-pinned -G Ninja
          -DCT_USE_SYSTEM_BOTAN=OFF
          -DCT_USE_SYSTEM_CAPNPROTO=OFF
      - name: Build and test
        run: |
          cmake --build build/client-pinned
          ctest --test-dir build/client-pinned --output-on-failure

  client-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential ca-certificates cmake ninja-build pkg-config python3 xz-utils
      - name: Build portable package
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          cmake -S client -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCT_PORTABLE_CLIENT=ON \
            -DCT_SOURCE_RELEASE_URL="$SOURCE_URL"
          cmake --build build/package
          ctest --test-dir build/package --output-on-failure
          cpack --config build/package/CPackConfig.cmake -B artifacts
          python3 tools/verify_client_package.py artifacts/*.tar.xz \
            --version 0.7.0 --run --require-source-url
          python3 tools/inspect_client_dependencies.py \
            build/package/cepheus-trader-door build/package/cepheus-trader-sysop \
            --report artifacts/DYNAMIC-DEPENDENCIES-linux-amd64.txt
          python3 tools/collect_release_artifacts.py build/package artifacts --label linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: cepheus-trader-client-0.7.0-linux-amd64
          path: artifacts/
          if-no-files-found: error
