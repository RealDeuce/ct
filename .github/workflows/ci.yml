name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install repository-check tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate repository and catalog
        run: |
          python3 tools/check_repository.py
          python3 -m unittest discover -s tools -p 'test_*.py'

  rust:
    needs: client-native
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build pkg-config python3
          capnproto libbotan-3-dev libcapnp-dev libgnutls28-dev
      - uses: actions/download-artifact@v8
        with:
          name: client-system-binaries
          path: build/client-system-artifact
      - name: Restore system client executables
        run: |
          mkdir -p build/client-system
          tar -C build/client-system -xzf \
            build/client-system-artifact/client-system-binaries.tar.gz
      - name: Select stable Rust with lint components
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: >-
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('server/Cargo.lock') }}-${{
            hashFiles('server/Cargo.toml', 'server/build.rs',
            'server/src/**', 'server/native/**', 'protocol/**', 'catalog/**') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/Cargo.lock') }}-
            rust-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Test
        env:
          CT_INTEROP_CLIENT_BUILD: ${{ github.workspace }}/build/client-system
        run: cargo test --manifest-path server/Cargo.toml
      - name: Version probes
        run: |
          cargo run --manifest-path server/Cargo.toml --bin cepheus-trader-server -- --version
          cargo run --manifest-path server/Cargo.toml --bin cepheus-trader-universe-tour -- --version

  client-native:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential ca-certificates ccache cmake ninja-build pkg-config python3
          capnproto libcapnp-dev libbotan-3-dev xz-utils
      - name: Identify C/C++ toolchain
        id: toolchain
        run: >-
          echo "key=$(cc -dumpmachine)-$(cc -dumpfullversion -dumpversion)"
          >> "$GITHUB_OUTPUT"
      - name: Restore OpenDoors
        id: opendoors-cache
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/opendoors
          key: client-dependency-opendoors-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/OpenDoors.cmake', 'client/cmake/dependencies/opendoors/CMakeLists.txt', 'client/third_party/opendoors/**') }}
      - name: Build OpenDoors
        if: steps.opendoors-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S client/cmake/dependencies/opendoors \
            -B build/dependency-build/opendoors -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/dependency-cache/opendoors" \
            -DCT_OPENDOORS_SOURCE_DIR="$GITHUB_WORKSPACE/client/third_party/opendoors"
          cmake --build build/dependency-build/opendoors
          cmake --install build/dependency-build/opendoors
      - name: Restore client compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-client-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/CMakeLists.txt', 'client/cmake/source-release.txt.in', 'client/include/**', 'client/src/**', 'client/tests/**', 'protocol/**', 'OPEN_GAME_LICENSE.md') }}-system
          restore-keys: |
            ccache-client-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
      - name: Configure, build, and test
        shell: bash
        run: |
          mkdir -p build
          ccache --zero-stats
          cmake -S client -B build/client-system -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCT_OPENDOORS_ROOT=${{ github.workspace }}/build/dependency-cache/opendoors 2>&1 \
            | tee build/client-system-configure.log
          grep -F "Using installed Botan" build/client-system-configure.log
          grep -F "Using installed Cap'n Proto" build/client-system-configure.log
          grep -F "Using cached OpenDoors static library" \
            build/client-system-configure.log
          cmake --build build/client-system
          ctest --test-dir build/client-system --output-on-failure
          build/client-system/cepheus-trader-door --version
          build/client-system/cepheus-trader-sysop --version
          ccache --show-stats
          tar -C build/client-system \
            -czf "$GITHUB_WORKSPACE/client-system-binaries.tar.gz" \
            cepheus-trader-admin cepheus-trader-client \
            cepheus-trader-door cepheus-trader-sysop
      - uses: actions/upload-artifact@v7
        with:
          name: client-system-binaries
          path: client-system-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1

  client-pinned-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential ca-certificates cmake ninja-build python3 xz-utils
      - name: Identify C/C++ toolchain
        id: toolchain
        run: >-
          echo "key=$(cc -dumpmachine)-$(cc -dumpfullversion -dumpversion)"
          >> "$GITHUB_OUTPUT"
      - name: Restore pinned Botan
        id: botan-cache
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/botan
          key: client-dependency-botan-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/BotanPinned.cmake', 'client/cmake/dependencies/botan/CMakeLists.txt') }}
      - name: Restore pinned Cap'n Proto and KJ
        id: capnproto-cache
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/capnproto
          key: client-dependency-capnproto-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/CapnProtoPinned.cmake', 'client/cmake/dependencies/capnproto/CMakeLists.txt') }}
      - name: Restore OpenDoors
        id: opendoors-cache
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/opendoors
          key: client-dependency-opendoors-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/OpenDoors.cmake', 'client/cmake/dependencies/opendoors/CMakeLists.txt', 'client/third_party/opendoors/**') }}
      - name: Build pinned Botan
        if: steps.botan-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S client/cmake/dependencies/botan \
            -B build/dependency-build/botan -G Ninja \
            -DCT_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/dependency-cache/botan"
          cmake --build build/dependency-build/botan
      - name: Build pinned Cap'n Proto and KJ
        if: steps.capnproto-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S client/cmake/dependencies/capnproto \
            -B build/dependency-build/capnproto -G Ninja \
            -DCT_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/dependency-cache/capnproto"
          cmake --build build/dependency-build/capnproto
      - name: Build OpenDoors
        if: steps.opendoors-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S client/cmake/dependencies/opendoors \
            -B build/dependency-build/opendoors -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/dependency-cache/opendoors" \
            -DCT_OPENDOORS_SOURCE_DIR="$GITHUB_WORKSPACE/client/third_party/opendoors"
          cmake --build build/dependency-build/opendoors
          cmake --install build/dependency-build/opendoors
      - name: Verify dependency installations
        run: |
          test -f build/dependency-cache/botan/lib/libbotan-3.a
          test -f build/dependency-cache/capnproto/lib/libcapnp.a
          test -f build/dependency-cache/capnproto/lib/libkj.a
          test -f build/dependency-cache/opendoors/lib/libODoors.a

  client-package:
    needs: client-pinned-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential ca-certificates ccache cmake ninja-build pkg-config python3 xz-utils
      - name: Identify C/C++ toolchain
        id: toolchain
        run: >-
          echo "key=$(cc -dumpmachine)-$(cc -dumpfullversion -dumpversion)"
          >> "$GITHUB_OUTPUT"
      - name: Restore pinned Botan
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/botan
          key: client-dependency-botan-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/BotanPinned.cmake', 'client/cmake/dependencies/botan/CMakeLists.txt') }}
          fail-on-cache-miss: true
      - name: Restore pinned Cap'n Proto and KJ
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/capnproto
          key: client-dependency-capnproto-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/CapnProtoPinned.cmake', 'client/cmake/dependencies/capnproto/CMakeLists.txt') }}
          fail-on-cache-miss: true
      - name: Restore OpenDoors
        uses: actions/cache@v6
        with:
          path: build/dependency-cache/opendoors
          key: client-dependency-opendoors-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/cmake/OpenDoors.cmake', 'client/cmake/dependencies/opendoors/CMakeLists.txt', 'client/third_party/opendoors/**') }}
          fail-on-cache-miss: true
      - name: Restore client compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-client-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('client/CMakeLists.txt', 'client/cmake/source-release.txt.in', 'client/include/**', 'client/src/**', 'client/tests/**', 'protocol/**', 'OPEN_GAME_LICENSE.md') }}
          restore-keys: |
            ccache-client-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
      - name: Build portable package
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          cmake -S client -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCT_BOTAN_ROOT=${{ github.workspace }}/build/dependency-cache/botan \
            -DCT_CAPNPROTO_ROOT=${{ github.workspace }}/build/dependency-cache/capnproto \
            -DCT_OPENDOORS_ROOT=${{ github.workspace }}/build/dependency-cache/opendoors \
            -DCT_PORTABLE_CLIENT=ON \
            -DCT_SOURCE_RELEASE_URL="$SOURCE_URL" 2>&1 \
            | tee build/package-configure.log
          grep -F "Using cached pinned Botan 3.12.0" build/package-configure.log
          grep -F "Using cached pinned Cap'n Proto 1.5.0" build/package-configure.log
          grep -F "Using cached OpenDoors static library" build/package-configure.log
          ccache --zero-stats
          cmake --build build/package
          ctest --test-dir build/package --output-on-failure
          cpack --config build/package/CPackConfig.cmake -B artifacts
          python3 tools/verify_client_package.py artifacts/*.tar.xz \
            --version 0.7.0 --run --require-source-url
          python3 tools/inspect_client_dependencies.py \
            build/package/cepheus-trader-door build/package/cepheus-trader-sysop \
            --report artifacts/DYNAMIC-DEPENDENCIES-linux-amd64.txt
          python3 tools/collect_release_artifacts.py build/package artifacts --label linux-amd64
          ccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: cepheus-trader-client-0.7.0-linux-amd64
          path: artifacts/
          if-no-files-found: error
