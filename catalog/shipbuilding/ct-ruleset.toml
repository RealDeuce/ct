# Cepheus Trader's explicit construction-rule composition policy.
#
# Source construction rules never replace the CE baseline merely because a
# field has the same name. Every collision below has a recorded resolution.

schema_version = 1
ruleset_id = "cepheus-trader.shipbuilding"
ruleset_revision = 1
extends_ruleset_ids = [
  "ce-srd-2016.shipbuilding",
  "ce-srd-2016.small-craft",
]
extension_module_ids = [
  "ct.af3.structures-and-components",
  "ct.af3.armament",
  "ct.earth-tech-2350",
]
source_ids = [
  "cepheus-engine-srd-2016",
  "ship-source-a-f",
  "ship-source-tech-update-2350",
  "cepheus-trader-2026",
]

[interstellar_drive_policy]
drive = "jump"
operational_ruleset = "ce-srd-2016"
fuel_formula = "hull-tonnage-times-jump-number-times-10-percent"
nominal_duration = "one-week"
allows_in_system_transit = false
has_routes_or_points = false
has_emitter_nodes = false
has_recharge_cycle = false
has_military_grade = false
has_bubble_failure = false

# The source Z-drive letter is retained only to audit a source design. New
# game designs use the optimized J-drive letter. Source-preserving conversion
# is available for forensic comparison but is not the game default.
[[drive_conversion]]
hull_tons = 100
source_z_code = "A"
source_preserving_j_code = "A"
optimized_j_code = "A"
recovered_millitons = 0
