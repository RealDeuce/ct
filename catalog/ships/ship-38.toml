# Rule-derived reconstruction of the basic 200-ton source trader. Ordinary
# Jump drive replaces the Zimm drive. The source's contradictory repair-drone
# row is replaced by the CE hull-percentage rule, and the delivered armament is
# made concrete: one beam laser plus one reserved fire-control station.

