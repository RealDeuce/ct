  "This two-hundred-ton frontier trader devotes nearly half its hull to freight while retaining a two-parsec jump radius, three-gravity acceleration, fuel purification, repair drones, and double-occupancy rooms for its four-person crew. Its streamlined hull can serve surface ports without support craft.",
