# Rule-derived conversion of source-inventory ship-126. Its Zimm and reaction
# drives, reaction mass, separate environmental plants, spin-gravity pods, and
# reaction-drive radiators are replaced by normal CE Jump, maneuver, power,
# life-support, and artificial-gravity rules. The power plant is raised to Q
# so it can actually support Jump drive Q. Recovered volume becomes cargo.

