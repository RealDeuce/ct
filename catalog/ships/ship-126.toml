description_paragraphs = [
  "This nineteen-hundred-ton distributed freighter is built around a very large hold, two-parsec jump range, and externally docked work craft. Eight defensive turrets, radiation shielding, self-sealing hull construction, repair drones, and emergency power give it the resilience expected of a long-haul commercial carrier.",
  "The Leviathan earns best on high-volume routes and can support speculative cargo on a large scale. One-gravity acceleration and a distributed hull make it unsuitable for surface operations or aggressive pursuit, so it relies on its work craft and planned port facilities.",
]

