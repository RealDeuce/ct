# Standard-passenger conversion of ship-38. Four ordinary CE staterooms and a
# five-ton passenger common/galley area replace the forward hold. This needs
# one ton more than the source's internally inconsistent twenty-ton table, so
# the rule-balanced cargo remainder is 67.7 tons.

