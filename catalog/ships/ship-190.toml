description_paragraphs = [
  "This three-hundred-ton scout carries a ten-person crew and specialist team, laboratory, probe drones, medical support, vehicle bay, repair drones, and a fast launch. Two consecutive two-parsec jumps, three-gravity maneuver, fuel processing, and advanced sensors support extended survey work away from established ports.",
  "Three laser and mixed defensive turrets provide modest protection, but the vessel is an explorer rather than a warship. Its externally clamped launch and compact mission facilities preserve stores space while leaving the scout dependent on careful planning during long deployments.",
]

