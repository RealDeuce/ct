# Rule-derived reconstruction of the three-hundred-ton long-range scout.
# Ordinary Jump replaces Zimm drive and prohibited one-year fuel cells become
# exact CE power fuel. The launch moves from an undersized full hangar to an
# external clamp, leaving a rule-balanced mission-stores hold.

