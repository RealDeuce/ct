  "This thousand-ton combatant combines a two-parsec jump radius, four-gravity maneuver, heavy armor, radiation shielding, emergency power, redundant computers, and facilities for thirty-five crew. A launch and utility boat support transfer, inspection, rescue, and boarding tasks.",
  "Two large meson bays and two particle-beam bays provide the main strike, backed by particle, laser, and sandcaster turrets and ten point-defense lasers. The dense weapons fit leaves limited cargo and makes the ship dependent on naval supply and maintenance support.",
]

