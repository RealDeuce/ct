# Rule-derived reconstruction of the thousand-ton fleet combatant. Ordinary
# Jump replaces military-grade Zimm drive; the source TL12 computer becomes
# redundant TL11 Model/3bis/fib systems, and all bay, turret, ammunition,
# accommodation, and carried-craft allocations use normalized rules.

