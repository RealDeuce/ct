# Rule-derived reconstruction of the 1,500-ton destroyer. Standard CE
# maneuver drive removes reaction mass, radiators, spin-gravity pods, and
# reaction-thrust protection. The recovered volume becomes a large logistics
# hold while all weapons, ammunition, craft, and support spaces remain real.

