# CE-compatible conversion of source-inventory ship-35. The source's sW drive
# is outside the CE 80-ton performance row and its extra beam turret conflicts
# with CE's single-hardpoint small-craft rule. Minimum CE five-gravity drives
# free nine tons, assigned to cargo.

