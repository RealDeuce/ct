# Rule-derived reconstruction of the artificial-gravity retrofit. Standard CE
# maneuver drive already supplies the gravity behavior for which this source
# variant sacrificed reaction mass, so its normalized fit converges with the
# other two family members rather than retaining a fictitious component.

