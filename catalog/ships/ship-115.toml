# Rule-derived reconstruction of the 2,000-ton gunboat carrier. Its six
# externally clamped 300-ton gunboats raise loaded displacement to 3,800
# tons, so standard CE Y drives and jump fuel are sized against the 4,000-ton
# performance bracket. Reaction mass, radiators, spin-gravity pods, and
# reaction-thrust protection are removed.

