description_paragraphs = [
  "This 2,000-ton carrier transports six 300-ton gunboats on external clamps while four utility craft occupy its internal hangar. Drives and jump fuel are sized for the 3,800-ton loaded combination, preserving two-gravity maneuver and a two-parsec jump radius with the full flotilla attached.",
  "Twenty weapon turrets and twenty point-defense nodes protect the carrier, while extensive berthing, medical, repair, workshop, detention, and ammunition facilities sustain its crews. The carrier is a mobile naval base rather than a merchant ship; its value and combat power depend heavily on retaining and servicing its gunboat group.",
]

