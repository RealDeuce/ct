description_paragraphs = [
  "This thousand-ton assault escort combines a two-parsec jump radius, four-gravity maneuver, reinforced structure, heavy armor, hardened controls, and accommodation for forty crew and thirty troops. A launch, survey cutter, vehicle bay, armories, medical support, and workshop sustain boarding and surface operations.",
  "Two particle-beam bays, laser, missile, and sandcaster turrets, and ten point-defense lasers provide strong escort firepower. Its troop and craft capacity make it useful for raids and security deployments, but those facilities sharply limit freight and require institutional logistics.",
]

