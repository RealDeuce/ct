# Rule-derived reconstruction of the thousand-ton assault escort. Ordinary
# Jump replaces Zimm drive, source half-step reinforcement becomes one normal
# reinforced-structure increment, and TL12 gatling point defense becomes TL11
# laser nodes. Crew, troops, escape capacity, craft, and vehicle support are
# normalized as executable components.

