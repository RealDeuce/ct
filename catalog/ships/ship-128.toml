# Rule-derived reconstruction of the 600-ton fast trader. Ordinary Jump drive
# replaces Zimm drive and prohibited fuel cells become two weeks of CE power
# fuel. Separate environmental plant rows are implicit in accommodation, while
# repair drones and support spaces use their normalized construction formulas.

