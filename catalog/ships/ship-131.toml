# Rule-derived reconstruction of the original 400-ton merchant configuration.
# Ordinary CE maneuver drive eliminates reaction mass, while CE accommodation
# subsumes the separate environmental machinery. The resulting rule-balanced
# ship is mechanically equivalent to the later conversions in this family.

