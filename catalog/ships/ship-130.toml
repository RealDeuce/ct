  "This assault transport carries sixty-four marines, their officers, and a seventy-ton vehicle package in a full maintenance hangar. Briefing, medical, armory, powered-armor maintenance, workshop, recreation, and emergency-berth facilities support an embarked unit across a two-parsec deployment.",
