description_paragraphs = [
  "This thousand-ton hospital ship supports one hundred general-care patients, ten isolation patients, four operating theaters, emergency low berths, and a large medical staff. Two medical cutters and a transfer launch bring treatment teams to casualties while the parent ship provides a two-parsec jump radius, four-gravity acceleration, repair drones, and six weeks of endurance.",
  "Six sandcaster turrets and ten point-defense lasers emphasize survival rather than offensive action, with four hardpoints reserved. The ship can provide major mobile medical capacity, but its large crew, specialized stores, and vulnerable patients make escorts and dependable logistical support essential in hostile regions.",
]

