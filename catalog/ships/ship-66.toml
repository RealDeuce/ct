  "A particle-beam turret and two mixed laser, missile, and sandcaster turrets give it useful coercive power without the expense of a fleet warship. The design works equally as a criminal raider or commissioned privateer; its survival depends on selecting vulnerable targets and leaving before a stronger response arrives.",
