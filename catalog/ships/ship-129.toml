  "This fleet-support conversion carries a large replenishment load and can transfer stores while underway. Three-gravity acceleration and a two-parsec jump radius let it accompany mobile forces, while military sensors, a medical bed, repair drones, workshop, office, and generous crew accommodation sustain a twenty-person complement.",
  "The same heavy laser battery and point-defense array as the commercial hull allow it to survive near contested routes, but it is a valuable support target rather than a line combatant. Its transfer gear and larger crew reduce cargo efficiency slightly in exchange for operational flexibility.",
]

