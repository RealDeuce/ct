# Steerage-passenger conversion of ship-38. The source's twenty-ton forward
# hold becomes fifteen steerage places, two shower-equipped heads, and a
# self-service galley/common area. Its stated thirty-person overload is an
# operating hazard, not installed accommodation, and is not catalog capacity.

