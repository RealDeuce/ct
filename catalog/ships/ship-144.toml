  "This two-hundred-ton system cutter combines six-gravity acceleration, military sensors, armored critical systems, redundant emergency power, a brig, and a fast boarding launch. It is intended to intercept suspect traffic, compel inspection, and deliver enforcement personnel rather than undertake interstellar patrols.",
  "Plasma weapons, a mixed defensive turret, and two point-defense nodes let the cutter dominate most merchants and resist light raiders. A useful evidence-and-supply hold supports extended patrols, but the Vidocq remains confined to its home system and depends on local bases for strategic movement.",
]

