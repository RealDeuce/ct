# Rule-derived conversion of source-inventory ship-144. The source describes
# an in-system cutter even though it installs a skip-only Zimm drive. That
# alternate drive, its fuel, one-year power cells, and duplicate life-support
# plants are removed. The result is a normal CE system ship; recovered volume
# becomes cargo.

