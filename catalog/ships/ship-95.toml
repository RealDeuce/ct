# Rule-derived correction of source-inventory ship-95. The source allocations
# total 602 tons. Replacing Z-drive H with ordinary Jump drive F recovers ten
# tons; the corrected build assigns the resulting net eight tons to cargo.
# The source also omits the cost of six point-defense node mounts and of its
# carried boat; both are real construction costs here.

