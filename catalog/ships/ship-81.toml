description_paragraphs = [
  "This five-hundred-ton armed merchant combines a two-parsec jump radius, two-gravity acceleration, four weeks of power endurance, strong hull armor, radiation shielding, repair drones, and nearly two hundred tons of cargo. Comfortable crew rooms, medical support, an armory, office, and workshop suit independent voyages through dangerous frontier regions.",
  "Three beam-laser turrets and two mixed laser, missile, and sandcaster turrets can deter raiders and support privateering or convoy work. It remains a merchant rather than a naval combatant: acceleration is modest, every fight risks its revenue-producing hull, and its weapons cannot substitute for judgment against purpose-built warships.",
]

