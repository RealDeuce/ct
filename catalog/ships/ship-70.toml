# Rule-derived reconstruction of the three-hundred-ton gunboat. Standard CE
# maneuver drive removes reaction mass, radiator, and reaction-thrust
# protection. The reduced particle installation becomes a normal 51-ton bay,
# and every defensive node and ammunition load is explicit.

