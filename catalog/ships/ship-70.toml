description_paragraphs = [
  "This three-hundred-ton gunboat combines four-gravity maneuver, radiation shielding, hardened controls, redundant computers, repair drones, emergency berths, and complete escape capacity. Replacing reaction propulsion with ordinary CE maneuver drive produces useful stores and patrol-cargo volume without sacrificing acceleration.",
  "A particle-beam bay and railgun barbette provide the main strike, with a mixed laser, missile, and sandcaster turret plus three point-defense nodes for close protection. It is a compact naval combatant with no jump capability and therefore depends on a carrier, tender, or permanent system base.",
]

