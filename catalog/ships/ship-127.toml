# Rule-derived conversion of source-inventory ship-127, the in-system variant
# of ship-126. The Zimm and reaction systems are removed entirely in favor of
# a normal CE maneuver drive. Its former interstellar-drive and fuel volume,
# as well as the reaction and spin-gravity allocations, becomes cargo.

