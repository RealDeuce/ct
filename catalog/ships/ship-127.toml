description_paragraphs = [
  "This in-system sister to the interstellar bulk freighter removes all jump machinery to maximize local freight capacity. It retains the defensive turrets, radiation shielding, self-sealing distributed hull, emergency power, repair systems, and two externally docked work craft of the long-haul design.",
  "More than four fifths of the hull is usable cargo volume, making the ship effective for orbital consolidation, moon-to-moon transport, and feeding jump-capable carriers. It cannot leave its system and accelerates at only one gravity, so its extraordinary capacity is balanced by long transfer times and complete dependence on local trade infrastructure.",
]

