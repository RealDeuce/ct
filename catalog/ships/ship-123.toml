# Rule-derived conversion of the 350-ton mobile support vessel. Its oversized
# alternate skip drive and skip fuel become an ordinary Jump-2 drive and exact
# CE fuel. Normalized accommodation, repair drones, and workshop allocation
# leave 148.75 tons of usable cargo around the large external docking clamp.

