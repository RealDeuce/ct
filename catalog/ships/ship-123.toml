description_paragraphs = [
  "This three-hundred-fifty-ton support ship carries a large external docking clamp capable of moving a vessel far larger than itself. A two-parsec jump radius, two-gravity acceleration, extensive freight space, fuel processing, repair drones, workshop, and hardened holographic bridge let a small crew reposition or sustain stranded and non-jump vessels.",
  "Three point-defense lasers offer protection against missiles but the ship has no offensive armament. Its value lies in rescue, ferry, repair, and logistical work; while carrying another ship it becomes a conspicuous, slow-to-defend target that should depend on escorts and careful routing.",
]

