  "This 4,500-ton commercial carrier moves more than 2,600 tons of freight across a two-parsec jump while two utility boats handle passengers and cargo away from major docking facilities. A large crew, medical support, workshops, offices, repair drones, emergency power, and a capital computer support sustained high-volume operations.",
