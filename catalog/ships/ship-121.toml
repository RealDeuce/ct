  "This five-hundred-ton escort combines six-gravity acceleration, a two-parsec jump radius, radiation protection, armored machinery and magazines, redundant computers, emergency power, advanced sensors, and a hardened holographic bridge. Its carried boarding boat, brig, medical bay, armory, and troop berthing support patrol and interdiction work.",
  "Two particle-beam barbettes provide the main punch while laser, missile, and sandcaster turrets and five point-defense nodes cover close engagements. The dense fit leaves only a small cargo hold and makes the ship dependent on naval logistics rather than commercial revenue.",
]

