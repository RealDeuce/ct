# Rule-derived reconstruction of the 2,500-ton fleet cruiser. Ordinary CE
# drives replace adjusted Zimm machinery. TL12 fusion bays and gatling point
# defense become TL11 particle bays and laser nodes; the non-CE gravity screen
# is omitted. All capital weapons, magazines, craft, and support spaces are
# concrete construction selections.

