description_paragraphs = [
  "This 2,500-ton fleet cruiser combines a command bridge, redundant capital computers, reinforced structure, heavy armor, four-gravity maneuver, and a two-parsec jump radius. Extensive crew spaces, medical support, repair drones, workshops, probe drones, a launch, and an armed boat support prolonged squadron operations.",
  "Meson, torpedo, and particle-beam bays form the main battery, while laser, missile, and sandcaster turrets and twenty-five point-defense lasers cover close defense. It is a powerful institutional warship whose large crew, ammunition demand, and operating cost make commercial independence impractical.",
]

