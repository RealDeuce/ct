# Rule-derived reconstruction of the 2,500-ton exploration carrier. Its
# intermediate hull uses the printed next CE bracket, ordinary Jump replaces
# Zimm drive, and prohibited long-duration fuel cells become two weeks of
# power fuel. Source TL12 survey sensors are downgraded to TL11 advanced
# sensors; the unpriced mineralogy suite is not silently assigned a value.

