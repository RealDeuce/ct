description_paragraphs = [
  "This 2,500-ton exploration carrier supports two long-range scouts, a survey cutter, and a utility boat alongside laboratories, cartography, sensor control, workshops, gardens, medical support, and offices. Two consecutive two-parsec jumps, extensive fuel processing, repair drones, and emergency power allow a large scientific expedition to operate far from developed ports.",
  "Twenty laser turrets, five mixed defensive turrets, and twenty-five point-defense lasers protect the expedition without turning it into a line warship. The large hangar and specialist accommodation make it a capable mobile survey base, but its size, crew, carried craft, and mission facilities impose major operating and logistical costs.",
]

