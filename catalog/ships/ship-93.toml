# Rule-derived conversion of the earlier 1,000-ton hospital-ship fit. Ordinary
# Jump and exact two-week power fuel replace alternate machinery; generic
# medical, accommodation, and hangar rules turn the source's under-allocation
# into 106.5 tons of medical stores and cargo.

