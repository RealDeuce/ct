  "This 1,200-ton intercept destroyer combines five-gravity acceleration, a two-parsec jump radius, heavy armor, radiation protection, hardened holographic controls, redundant computers, and extensive crew and support facilities. A utility boat and fast launch support boarding, personnel transfer, and patrol work.",
  "Two meson bays and two particle-beam bays form the main battery, backed by laser and missile turrets and twelve point-defense lasers. It is optimized to catch and defeat raiders, but its large crew, ammunition load, and military systems require dependable naval logistics.",
]

