# Rule-derived reconstruction of the 1,200-ton intercept destroyer. Ordinary
# Jump directly replaces Zimm drive; TL12 fusion bays and gatling lasers
# become TL11 particle bays and point-defense lasers. Separate environmental
# machinery is intrinsic to CE ships, and all remaining support is normalized.

