# Rule-derived conversion of source-inventory ship-107. The alternate Zimm
# and reaction drives, reaction mass, spin-gravity pods, acceleration
# protection, and reaction-drive radiators are replaced by ordinary CE Jump
# and maneuver drives with normal artificial gravity. The recovered volume is
# usable cargo. Published round-ton approximations are replaced by exact rule
# values, and the carried craft are priced as completed catalog designs.

