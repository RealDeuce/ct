description_paragraphs = [
  "This four-hundred-ton patrol ship combines six-gravity acceleration, heavy armor, radiation shielding, advanced sensors, emergency power, and a one-parsec jump radius. A fast launch rides on an external clamp for boarding, personnel transfer, and utility work without consuming pressurized hangar volume.",
  "A particle-beam bay and particle-beam barbette provide heavy striking power, backed by laser, missile, and sandcaster turrets and four point-defense lasers. The dense military fit, large crew, and short jump radius make it a local enforcement and system-defense asset rather than an independent long-range cruiser.",
]

