# Rule-derived reconstruction of the four-hundred-ton patrol ship. Ordinary
# Jump-1 replaces its skip-only Zimm installation. The full hangar becomes a
# rugged docking clamp, preserving the carried launch while paying for real
# jump fuel; gatling point defense is normalized to TL11 laser nodes.

