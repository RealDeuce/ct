# Normalized Open Game Content used by the vessel-combat engine.  This is
# authoritative game data, not a PDF extraction.  Ship catalog records refer
# to these identities; every installed weapon must resolve here.
schema_version = 1
ruleset_id = "cepheus-trader.vessel-combat"
revision = 1
source_ids = ["cepheus-engine-srd-2016", "ship-source-a-f", "cepheus-trader-2026"]

# difficulty_dm is ordered Adjacent, Close, Short, Medium, Long, Very Long,
# Distant.  -99 means the weapon cannot attack at that range.
# Traits: beam permits sand; missile has delayed impact and point defence;
# radiation causes the CE bonus crew hit; meson ignores armour and starts on
# the internal table; screen identifies the defensive screen that applies.

